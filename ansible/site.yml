---
- name: Configure HashiCorp Vault Server
  hosts: vault
  become: true
  gather_facts: true

  vars:
    vault_version: "latest"

    # Host paths — bind-mount sources, and the only paths Ansible itself touches.
    vault_data_dir: /opt/vault/data
    vault_config_dir: /etc/vault.d

    # Container paths — bind-mount targets. Anything Vault reads out of its own
    # config must use these, never the host paths above. Mixing the two is what
    # made Vault crash-loop on "failed to open bolt file: no such file or
    # directory" while the published port still looked healthy.
    vault_container_data_dir: /vault/data
    vault_container_config_dir: /vault/config

    vault_port: 8200
    nginx_conf_dir: /etc/nginx/sites-available
    nginx_enabled_dir: /etc/nginx/sites-enabled

  pre_tasks:
    - name: Wait for apt lock to be released
      ansible.builtin.shell: while fuser /var/lib/dpkg/lock-frontend > /dev/null 2>&1; do sleep 5; done
      changed_when: false
      timeout: 120

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 10

  tasks:
    # ── Docker ──────────────────────────────────────────────────
    - name: Install Docker dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ── Vault Directories ────────────────────────────────────────
    # vault config dir: owned root, world-readable so UID 100 in container can read vault.hcl
    - name: Create Vault config directory
      ansible.builtin.file:
        path: "{{ vault_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # vault data dir: owned by UID 100 (vault user in Docker image) for Raft write access
    - name: Create Vault data directory
      ansible.builtin.file:
        path: "{{ vault_data_dir }}"
        state: directory
        owner: "100"
        group: "1000"
        mode: "0750"

    # ── Vault Config ─────────────────────────────────────────────
    # mode 0644: world-readable so vault UID 100 inside the container can read it.
    # No secrets in this file (paths and listener settings only).
    - name: Deploy Vault configuration
      ansible.builtin.template:
        src: vault.hcl.j2
        dest: "{{ vault_config_dir }}/vault.hcl"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Vault

    # ── Vault systemd Service ────────────────────────────────────
    - name: Deploy Vault systemd service
      ansible.builtin.template:
        src: vault.service.j2
        dest: /etc/systemd/system/vault.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Vault

    - name: Enable and start Vault service
      ansible.builtin.service:
        name: vault
        state: started
        enabled: true

    # NOT a port check. Docker publishes the port by starting docker-proxy as
    # soon as the container is created, so 127.0.0.1:8200 accepts connections
    # even while Vault is crash-looping inside the container — which is exactly
    # how a broken storage path stayed invisible for eight deploys. Ask Vault
    # itself, and treat only a real API response as proof it is up.
    - name: Wait for Vault to answer on port {{ vault_port }}
      block:
        - name: Query Vault health directly
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ vault_port }}/v1/sys/health?uninitcode=204&sealedcode=204&standbycode=204"
            status_code: [200, 204, 429, 472, 473, 501, 503]
          register: vault_direct_health
          retries: 20
          delay: 5
          until: vault_direct_health is succeeded
      rescue:
        - name: Report Vault diagnostics
          ansible.builtin.include_tasks: tasks/vault-diagnostics.yml
        - name: Fail after reporting diagnostics
          ansible.builtin.fail:
            msg: >-
              Vault never answered on 127.0.0.1:{{ vault_port }}. The diagnostics
              dump above has the container and systemd state at time of failure.

    # ── Nginx ────────────────────────────────────────────────────
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy Nginx Vault vhost
      ansible.builtin.template:
        src: vault-nginx.conf.j2
        dest: "{{ nginx_conf_dir }}/vault"
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

    - name: Enable Vault vhost
      ansible.builtin.file:
        src: "{{ nginx_conf_dir }}/vault"
        dest: "{{ nginx_enabled_dir }}/vault"
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: "{{ nginx_enabled_dir }}/default"
        state: absent
      notify: Reload Nginx

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # Fail here, with `nginx -t` output in the log, rather than letting a bad
    # vhost surface as an unexplained 404 in the verify stage.
    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    # The handler above only fires when a config file actually changed. On a
    # re-run against an instance whose running Nginx never picked up the vhost,
    # every file is already correct on disk, no handler fires, and Nginx keeps
    # serving its stock default site. Reload unconditionally so the running
    # process always matches what is on disk.
    - name: Reload Nginx to match on-disk configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded

    # ── Convergence checks ───────────────────────────────────────
    - name: Confirm Vault and the Nginx proxy are both healthy
      block:
        # The Restart Vault handler tears the container down and back up, so the
        # earlier check says nothing about the Vault that is running now. Ask
        # again, on this side of the restart.
        - name: Verify Vault answers directly after restart
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ vault_port }}/v1/sys/health?uninitcode=204&sealedcode=204&standbycode=204"
            status_code: [200, 204, 429, 472, 473, 501, 503]
          register: vault_direct_health_post
          retries: 20
          delay: 6
          until: vault_direct_health_post is succeeded

        - name: Wait for Nginx on port 80
          ansible.builtin.wait_for:
            port: 80
            host: 127.0.0.1
            delay: 3
            timeout: 30

        # Proves Nginx is proxying to a live Vault rather than serving its own
        # error page. Vault is uninitialized on a fresh deploy, so accept every
        # status code that means "Vault answered" — 404 (Nginx serving its
        # default site) and 502 (Vault down) are deliberately not among them.
        - name: Verify Nginx proxies through to the Vault API
          ansible.builtin.uri:
            url: "http://127.0.0.1/v1/sys/health?uninitcode=204&sealedcode=204&standbycode=204"
            status_code: [200, 204, 429, 472, 473, 501, 503]
          register: vault_proxy_health
          retries: 20
          delay: 6
          until: vault_proxy_health is succeeded

      rescue:
        - name: Report Vault diagnostics
          ansible.builtin.include_tasks: tasks/vault-diagnostics.yml

        - name: Fail after reporting diagnostics
          ansible.builtin.fail:
            msg: >-
              Vault did not come back healthy behind Nginx. The diagnostics dump
              above has the systemd, container and socket state at time of
              failure.

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Vault
      ansible.builtin.service:
        name: vault
        state: restarted

    # This used to run `nginx -t` with changed_when: false and chain
    # `notify: Restart Nginx`. A handler only notifies another handler when it
    # reports "changed", so changed_when: false made that chain dead code —
    # Nginx was never reloaded, kept serving its stock default site, and
    # answered /v1/sys/health with a 404. Validation now lives in a task; this
    # handler does the reload itself.
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
